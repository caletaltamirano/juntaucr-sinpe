<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JUNTAUCR SINPE Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#5B6B82; --faint:#8A97AB; --line:#E2E7EF;
  --nav:#0B2545; --nav-ink:#B9C7DC; --brand:#0B5CAD; --brand-soft:#E6F0FB; --accent:#00A3E0;
  --ok:#0E7A55; --ok-bg:#E2F4EC; --warn:#9A5B00; --warn-bg:#FFF2D9; --err:#B42318; --err-bg:#FDE8E6;
  --neu:#475467; --neu-bg:#EEF1F5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#D5DBE5;font-size:14px;line-height:1.45}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;letter-spacing:-.2px}
.muted{color:var(--muted)} .small{font-size:12px} .b{font-weight:600}

/* lienzo */
.canvas{padding:48px 40px;display:flex;flex-direction:column;gap:64px;align-items:center}
.canvas-head{width:1440px}
.canvas-head h1{font-size:28px;letter-spacing:-.4px}
.canvas-head p{color:#475467;margin-top:6px}
.label{width:1440px;font-weight:600;color:#344054;margin-bottom:12px;font-size:16px}
.demo{background:var(--bg);min-height:100vh;display:flex;justify-content:center}

/* frame */
.frame{width:1440px;min-height:900px;background:var(--bg);display:flex;position:relative;overflow:hidden}
.canvas .frame{box-shadow:0 10px 34px rgba(15,27,45,.14)}
.side{width:248px;background:var(--nav);color:var(--nav-ink);padding:24px 16px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 26px;color:#fff;font-weight:700;font-size:17px}
.logo small{display:block;font-weight:500;font-size:11px;color:var(--nav-ink);letter-spacing:.3px}
.mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--brand));display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:500}
.nav:hover{background:rgba(255,255,255,.06)}
.nav.on{background:rgba(255,255,255,.13);color:#fff}
.nav svg{width:18px;height:18px}
.side-foot{margin-top:auto;padding:12px;border-radius:8px;background:rgba(255,255,255,.06);font-size:12px;color:#DCE5F2}
.side-foot span{opacity:.7}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:64px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 32px;gap:16px;flex-shrink:0}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:0 12px;height:38px;width:360px;color:var(--faint)}
.search svg{width:16px;height:16px}
.user{margin-left:auto;display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:600;font-size:13px;flex-shrink:0}
.avatar.lg{width:56px;height:56px;font-size:19px}
.content{padding:28px 32px 40px;display:flex;flex-direction:column;gap:24px}

.page-head{display:flex;align-items:flex-end;gap:16px}
.page-head h2{font-size:24px;font-weight:700;letter-spacing:-.3px}
.page-head p{color:var(--muted);margin-top:4px}
.page-head .actions{margin-left:auto;display:flex;gap:10px}
.crumb{color:var(--muted);font-size:13px;margin-bottom:6px}
.crumb a{color:var(--brand);cursor:pointer;font-weight:500}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;min-height:60px}
.card-h h3{font-size:16px;font-weight:600}
.card-h .actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.dan{color:var(--err);border-color:#F1C4BE}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.lg{height:46px;padding:0 22px;font-size:15px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand);padding:0 6px}
.btn.full{width:100%}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:11px 20px;background:#F8FAFC;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 20px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.link{cursor:pointer} tr.link:hover td{background:#FAFBFD}
.r{text-align:right}

.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.plain::before{display:none}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-err{background:var(--err-bg);color:var(--err)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-neu{background:var(--neu-bg);color:var(--neu)}
.b-info{background:var(--brand-soft);color:var(--brand)}

.grid{display:grid;gap:24px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.gm{grid-template-columns:1.55fr 1fr} .gm2{grid-template-columns:1fr 1.55fr}
.stat{padding:20px}
.stat .k{color:var(--muted);font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
.stat .v{font-size:28px;font-weight:700;margin-top:8px;letter-spacing:-.5px}
.stat .s{color:var(--muted);font-size:12px;margin-top:2px}

.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:13px;font-weight:600;color:#344054}
.input{min-height:42px;border:1px solid #CFD6E2;border-radius:8px;padding:0 12px;display:flex;align-items:center;gap:8px;background:#fff}
.input.ph{color:var(--faint)}
.input.sel::after{content:'';margin-left:auto;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-2px) rotate(45deg);flex-shrink:0}
.input.ok{border-color:var(--ok)} .input.bad{border-color:var(--err)}
.input.focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.input .pre{color:var(--muted);font-weight:600}
.input .end{margin-left:auto}
.hint{font-size:12px;color:var(--muted)} .hint.ok{color:var(--ok)} .hint.bad{color:var(--err)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}
.span2{grid-column:span 2}

.alert{display:flex;gap:12px;padding:14px 16px;border-radius:10px;font-size:13px}
.alert svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.a-info{background:var(--brand-soft);color:#0B3F78}
.a-warn{background:var(--warn-bg);color:#6E4100}
.a-err{background:var(--err-bg);color:#8A1C12}
.a-ok{background:var(--ok-bg);color:#0A5A3F}

.tabs{display:inline-flex;align-self:flex-start;background:#E6EAF1;border-radius:10px;padding:4px;gap:4px}
.tab{padding:7px 16px;border-radius:7px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;gap:8px;align-items:center}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(15,27,45,.1)}
.tab .n{font-size:12px;background:var(--neu-bg);color:var(--neu);border-radius:999px;padding:0 7px}

.overlay{position:absolute;inset:0;background:rgba(11,22,40,.48);display:flex;align-items:center;justify-content:center;z-index:5}
.modal{width:580px;background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.28);overflow:hidden}
.modal .card-h{padding:20px 24px} .modal .card-b{padding:24px}
.modal-f{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:#FAFBFD}

.row{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex-shrink:0}
.ic svg{width:18px;height:18px}
.ic.ok{background:var(--ok-bg);color:var(--ok)} .ic.err{background:var(--err-bg);color:var(--err)} .ic.neu{background:var(--neu-bg);color:var(--neu)}

.rule{display:flex;gap:10px;align-items:flex-start;padding:9px 0;font-size:13px}
.rule .ck{width:20px;height:20px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;flex-shrink:0}
.rule .ck.x{background:var(--err-bg);color:var(--err)}
.rule .ck svg{width:12px;height:12px}

.pick{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;gap:12px;align-items:center;cursor:pointer}
.pick.on{border-color:var(--brand);background:#F5F9FE;box-shadow:0 0 0 1px var(--brand)}
.pick.off{background:#FAFBFC;cursor:not-allowed}
.pick.off .grow{opacity:.6}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid #B7C1D1;flex-shrink:0}
.pick.on .radio{border:5px solid var(--brand)}
.stack{display:flex;flex-direction:column;gap:10px}

.kv{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.big-ic{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px}
.big-ic svg{width:36px;height:36px}
.result{width:600px;margin:8px auto 0;text-align:center}
.result h2{font-size:26px;letter-spacing:-.3px}
.result .card{text-align:left;margin-top:24px}

.tl{position:relative;padding-left:4px}
.tl-i{display:flex;gap:16px;position:relative;padding-bottom:22px}
.tl-i:not(:last-child)::before{content:'';position:absolute;left:15px;top:34px;bottom:4px;width:2px;background:var(--line)}
.tl-d{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.tl-d svg{width:15px;height:15px}
.dest{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:var(--ok-bg);color:#0A5A3F;font-size:13px}
.amount{font-size:34px;font-weight:700;letter-spacing:-.6px}
.pos{color:var(--ok);font-weight:600} .neg{color:var(--ink);font-weight:600}
.arrow{display:grid;place-items:center;color:var(--faint)} .arrow svg{width:22px;height:22px}

/* login */
.login{display:flex;width:100%}
.login-art{width:640px;background:linear-gradient(160deg,#0B2545 0%,#0B5CAD 70%,#00A3E0 130%);color:#fff;padding:56px;display:flex;flex-direction:column}
.login-art h1{font-size:40px;line-height:1.15;letter-spacing:-.8px;margin-top:auto}
.login-art p{color:#C9D9F0;margin-top:14px;font-size:16px;max-width:440px}
.login-form{flex:1;display:grid;place-items:center}
.login-box{width:400px;display:flex;flex-direction:column;gap:18px}
.login-box h2{font-size:26px;letter-spacing:-.4px}

.demo-bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#0F1B2D;color:#fff;border-radius:999px;padding:8px 10px 8px 16px;display:flex;gap:12px;align-items:center;font-size:13px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.demo-bar a{color:#fff;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:999px;text-decoration:none}
</style>
</head>

/* ---------- Render ---------- */
const q = new URLSearchParams(location.search);
const app = document.getElementById('app');
const frame = s => `<div class="frame" id="f-${s.id}">${s.html()}</div>`;

if (q.get('pantalla')) {
  const s = SCREENS.find(x => x.id === q.get('pantalla')) || SCREENS[0];
  document.body.style.background = 'var(--bg)';
  app.innerHTML = frame(s);
  app.firstElementChild.style.minHeight = '100vh';
} else if (q.get('modo') === 'demo') {
  const show = () => {
    const s = SCREENS.find(x => x.id === location.hash.slice(1)) || SCREENS[0];
    app.innerHTML = `<div class="demo">${frame(s)}</div><div class="demo-bar">Prototipo navegable · ${s.name}<a href="?">Ver lienzo</a></div>`;
    window.scrollTo(0, 0);
  };
  window.addEventListener('hashchange', show);
  app.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) location.hash = g.dataset.go; });
  show();
} else {
  app.innerHTML = `<div class="canvas">
    <div class="canvas-head"><h1>JUNTAUCR · SINPE Móvil — Prototipo</h1>
      <p>${SCREENS.length} pantallas · 1440 px de ancho · datos ficticios. <a href="?modo=demo">Abrir prototipo navegable →</a></p></div>
    ${SCREENS.map((s, i) => `<div><div class="label">${String(i + 1).padStart(2, '0')} · ${s.name}</div>${frame(s)}</div>`).join('')}
  </div>`;
  app.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) document.getElementById('f-' + g.dataset.go)?.scrollIntoView({behavior:'smooth', block:'start'}); });
}
</script>

</html>
