<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JUNTAUCR SINPE Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* marco teñido del billete, hoja blanca encima */
  --frame:#E1EBE6; --frame-hi:#D2DFD9; --sheet:#FFFFFF; --sub:#F4F8F6;
  --line:#E2E9E5; --line-2:#C9D6CF;
  --ink:#0F231C; --ink-2:#4A5E56; --ink-3:#62756D;
  --accent:#0E6A52; --accent-hi:#0B5945; --accent-pale:#E0EFE8;
  --neg:#B3261E; --neg-pale:#FBEAE8; --warn:#865600; --warn-pale:#FAF0DA;
  --ease-out:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--ink);background:#C9D3CE;font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent-pale);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:.01em;white-space:nowrap}
.ink2{color:var(--ink-2)} .ink3{color:var(--ink-3)} .sm{font-size:13px} .xs{font-size:12px} .b{font-weight:600} .r{text-align:right}

/* ---------- lienzo / demo ---------- */
.canvas{padding:48px 40px;display:flex;flex-direction:column;gap:64px;align-items:center}
.canvas-head{width:1440px}
.canvas-head h1{font-size:28px;letter-spacing:-.02em}
.canvas-head p{color:var(--ink-2);margin-top:6px}
.canvas-head a{color:var(--accent);font-weight:600}
.label{width:1440px;font-weight:600;color:var(--ink-2);margin-bottom:12px;font-size:15px}
.demo{background:var(--frame);min-height:100vh;display:flex;justify-content:center}

/* ---------- marco ---------- */
.frame{width:1440px;min-height:900px;background:var(--frame);display:grid;grid-template-columns:232px 1fr;grid-template-rows:48px 1fr;position:relative;overflow:hidden}
.canvas .frame{box-shadow:0 12px 40px rgba(15,35,28,.16)}
.side{grid-row:1 / 3;display:flex;flex-direction:column;padding:10px 10px 12px}
.ws{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;height:44px;margin-bottom:14px}
.ws .t{font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.15}
.ws .s{font-size:12px;color:var(--ink-2);font-weight:500}
.ws svg.chev{margin-left:auto;width:14px;height:14px;color:var(--ink-3)}
.grp{font-size:12px;color:var(--ink-3);font-weight:500;padding:16px 12px 6px}
.nav{display:flex;align-items:center;gap:10px;height:34px;padding:0 12px;border-radius:8px;color:var(--ink-2);cursor:pointer;transition:background-color 150ms ease,color 150ms ease}
.nav svg{width:16px;height:16px;flex-shrink:0}
.nav.on{background:var(--frame-hi);color:var(--ink);font-weight:500}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:8px}
.me .t{font-weight:600;font-size:13px;line-height:1.2}
.me .s{font-size:12px;color:var(--ink-2)}

.top{display:flex;align-items:center;gap:16px;padding:0 20px 0 12px}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-weight:500;min-width:260px}
.crumbs a{cursor:pointer}
.crumbs b{color:var(--ink);font-weight:600}
.crumbs .sep{color:var(--ink-3)}
.search{display:flex;align-items:center;gap:8px;height:32px;width:460px;margin:0 auto;padding:0 10px;border-radius:8px;background:rgba(255,255,255,.6);color:var(--ink-3)}
.search svg{width:15px;height:15px}
.kbd{margin-left:auto;font-size:12px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;line-height:18px}
.envt{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);font-weight:500}
.envt i{width:7px;height:7px;border-radius:50%;background:var(--warn)}

.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:16px;margin:0 8px 8px 0;min-width:0;display:flex;flex-direction:column}
.content{padding:28px 32px 40px;display:flex;flex-direction:column;gap:28px}

/* ---------- título de pantalla ---------- */
.title{display:flex;align-items:flex-end;gap:20px}
.title h1{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.title p{color:var(--ink-2);margin-top:4px;max-width:70ch}
.title .act{margin-left:auto;display:flex;gap:8px}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;font-weight:600;font-size:14px;line-height:1;border:1px solid var(--line-2);background:var(--sheet);color:var(--ink);cursor:pointer;white-space:nowrap;transition:transform 120ms var(--ease-out),background-color 150ms ease,border-color 150ms ease}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.neg{color:var(--neg);border-color:#EBC3BF}
.btn.negf{background:var(--neg);border-color:var(--neg);color:#fff}
.btn.s{height:30px;padding:0 10px;font-size:13px}
.btn.l{height:44px;padding:0 20px;font-size:15px}
.btn.q{border-color:transparent;background:transparent;color:var(--accent);padding:0 4px}
.btn.w{width:100%}
@media (hover:hover) and (pointer:fine){
  .nav:hover{background:rgba(255,255,255,.45);color:var(--ink)}
  .nav.on:hover{background:var(--frame-hi)}
  .btn:hover{border-color:#B5C5BD}
  .btn.pri:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
  .btn.q:hover{text-decoration:underline;text-underline-offset:3px}
  tr.go:hover td{background:var(--sub)}
  .pick:not(.off):hover{border-color:#B5C5BD}
}

/* ---------- bloques ---------- */
.block{border:1px solid var(--line);border-radius:12px;min-width:0}
.bh{display:flex;align-items:center;gap:10px;padding:14px 20px;min-height:56px}
.bh h2{font-size:16px;font-weight:600;letter-spacing:-.01em}
.bh .act{margin-left:auto;display:flex;gap:8px;align-items:center}
.bb{padding:0 20px 20px}
.bb.pt{padding-top:4px}
.cols{display:grid;gap:24px}
.c2{grid-template-columns:1fr 1fr} .c21{grid-template-columns:2fr 1fr} .c12{grid-template-columns:1fr 2fr} .c32{grid-template-columns:3fr 2fr}

/* cifras como texto, no tarjetas */
.figs{display:flex;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fig{flex:1;padding:16px 24px 16px 0}
.fig + .fig{padding-left:24px;border-left:1px solid var(--line)}
.fig .k{color:var(--ink-2);font-size:13px;font-weight:500}
.fig .v{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.fig .n{font-size:13px;color:var(--ink-2)}
.big{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.huge{font-size:44px;font-weight:600;letter-spacing:-.025em;line-height:1.05}
.pos{color:var(--accent)} .negc{color:var(--neg)}

/* tablas: reglas y alineación */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;font-weight:500;color:var(--ink-2);padding:10px 20px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 20px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.go{cursor:pointer} tr.go td{transition:background-color 150ms ease}
tfoot td{border-top:1px solid var(--line-2);font-weight:600}
th.r,td.r{text-align:right}

/* estado: punto + texto, sin píldoras */
.st{display:inline-flex;align-items:center;gap:7px;font-weight:500;white-space:nowrap}
.st::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.st.ok{color:var(--accent)} .st.no{color:var(--ink-3)} .st.bad{color:var(--neg)}
.st.hollow::before{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
.cur{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.cur.usd{color:var(--warn)}

.who{display:flex;align-items:center;gap:10px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.av.l{width:52px;height:52px;font-size:18px}

/* formularios */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-size:13px;font-weight:500;color:var(--ink)}
.in{min-height:40px;border:1px solid var(--line-2);border-radius:6px;padding:0 12px;display:flex;align-items:center;gap:8px;background:#fff}
.in.ph{color:var(--ink-3)}
.in.sel::after{content:'';margin-left:auto;width:6px;height:6px;border-right:1.5px solid var(--ink-2);border-bottom:1.5px solid var(--ink-2);transform:translateY(-2px) rotate(45deg);flex-shrink:0}
.in.foc{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-pale)}
.in.ok{border-color:var(--accent)}
.in .pre{color:var(--ink-2);font-weight:600}
.in .end{margin-left:auto}
.hint{font-size:12px;color:var(--ink-2)} .hint.ok{color:var(--accent)} .hint.bad{color:var(--neg)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}
.s2{grid-column:span 2}

.note{display:flex;gap:10px;padding:12px 14px;border-radius:8px;background:var(--sub);color:var(--ink);font-size:13px}
.note svg{width:16px;height:16px;flex-shrink:0;margin-top:2px;color:var(--ink-2)}
.note.ok{background:var(--accent-pale)} .note.ok svg{color:var(--accent)}
.note.warn{background:var(--warn-pale)} .note.warn svg{color:var(--warn)}
.note.bad{background:var(--neg-pale)} .note.bad svg{color:var(--neg)}

.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line)}
.tab{display:flex;align-items:center;gap:8px;height:40px;color:var(--ink-2);font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .c{font-size:12px;color:var(--ink-3)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg span{padding:0 12px;height:32px;display:flex;align-items:center;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer}
.seg span + span{border-left:1px solid var(--line-2)}
.seg .on{background:var(--sub);color:var(--ink)}

.checks{display:flex;flex-direction:column}
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:13px}
.ck svg{width:16px;height:16px;flex-shrink:0;margin-top:2px;color:var(--accent)}
.ck.x svg{color:var(--neg)}

.pick{border:1px solid var(--line-2);border-radius:8px;padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:border-color 150ms ease}
.pick.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pick.off{cursor:not-allowed;background:var(--sub);border-color:var(--line)}
.pick .g{flex:1;min-width:0}
.radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2);flex-shrink:0}
.pick.on .radio{border:5px solid var(--accent)}
.stack{display:flex;flex-direction:column;gap:8px}

.kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv>span:first-child{color:var(--ink-2)}

/* ---------- el par SINPE: elemento propio ---------- */
.pair{display:grid;grid-template-columns:minmax(0,max-content) 1fr minmax(0,max-content);align-items:center;gap:14px}
.pe .pn{font-weight:600;white-space:nowrap}
.pe .ps{font-size:12px;color:var(--ink-2);white-space:nowrap}
.pe.r{text-align:right}
.pl{position:relative;height:26px;display:flex;align-items:center;justify-content:center;min-width:80px}
.pl i{position:absolute;left:4px;right:2px;top:50%;height:2px;margin-top:-1px;background:var(--accent)}
.pl::before{content:'';position:absolute;left:0;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--accent)}
.pl::after{content:'';position:absolute;right:1px;top:50%;width:7px;height:7px;margin-top:-4.5px;border-top:2px solid var(--accent);border-right:2px solid var(--accent);transform:rotate(45deg)}
.pa{position:relative;background:var(--sheet);padding:0 10px;font-weight:600;white-space:nowrap}
.pair.lg .pn{font-size:20px;letter-spacing:-.01em}
.pair.lg .ps{font-size:13px}
.pair.lg .pa{font-size:20px}
.pair.lg .pl{height:40px}
.pair.mute .pl i{background:var(--line-2)} .pair.mute .pl::before{background:var(--line-2)} .pair.mute .pl::after{border-color:var(--line-2)}
.pair.sub .pa{background:var(--sub)}
.pair.fix{grid-template-columns:140px 1fr 140px}
.link{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.link i{width:28px;height:2px;background:var(--accent);position:relative}
.link i::after{content:'';position:absolute;right:0;top:-3px;width:6px;height:6px;border-top:2px solid var(--accent);border-right:2px solid var(--accent);transform:rotate(45deg)}
.acct{border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.acct + .acct{margin-top:10px}
.acct-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ph-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.ph-row .g{flex:1}

/* rechazo: dos teléfonos que caen en la misma cuenta */
.vee{position:relative;height:150px;width:560px;margin:0 auto}
.vee svg{position:absolute;inset:0;width:100%;height:100%}
.vee .a,.vee .b2,.vee .c3{position:absolute;text-align:center}
.vee .a{left:0;top:0;width:150px} .vee .b2{right:0;top:0;width:150px} .vee .c3{left:50%;bottom:0;transform:translateX(-50%);width:220px}

/* ---------- capas ---------- */
.scrim{position:absolute;inset:0;background:rgba(10,30,24,.42);z-index:5}
.modal{position:absolute;z-index:6;left:50%;top:50%;width:560px;transform:translate(-50%,-50%);background:#fff;border-radius:14px;box-shadow:0 24px 64px rgba(10,30,24,.28),0 2px 6px rgba(10,30,24,.08)}
.mh{display:flex;align-items:center;padding:20px 24px 4px}
.mh h2{font-size:18px;font-weight:600;letter-spacing:-.01em}
.mh .x{margin-left:auto;color:var(--ink-2);width:32px;height:32px;display:grid;place-items:center;border-radius:6px}
.mh .x svg{width:18px;height:18px}
.mb{padding:16px 24px 24px}
.mf{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.drawer{position:absolute;z-index:6;top:8px;right:8px;bottom:8px;width:460px;background:#fff;border-radius:14px;box-shadow:0 24px 64px rgba(10,30,24,.28);display:flex;flex-direction:column}
.drawer .mb{flex:1}

/* movimiento: solo como respuesta, nunca de entrada (Emil Kowalski / taste) */
.motion .modal{animation:pop 220ms var(--ease-out)}
.motion .drawer{animation:slide 260ms var(--ease-out)}
.motion .scrim{animation:fade 200ms ease-out}
.motion .pair.live .pl i{animation:draw 420ms var(--ease-out) 80ms both}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.96)}}
@keyframes slide{from{opacity:0;transform:translateX(24px)}}
@keyframes fade{from{opacity:0}}
@keyframes draw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion:reduce){
  .motion .modal,.motion .drawer,.motion .pair.live .pl i{animation:fade 150ms ease-out}
  .btn:active{transform:none}
}

/* login */
.login{grid-column:1 / 3;grid-row:1 / 3;display:grid;place-items:center;padding:40px}
.login-card{width:440px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:36px;display:flex;flex-direction:column;gap:18px}
.login-card h1{font-size:24px;letter-spacing:-.02em;font-weight:600}

.demo-bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:6px 6px 6px 16px;display:flex;gap:12px;align-items:center;font-size:13px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.demo-bar a{color:#fff;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:999px;text-decoration:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
const P = {
  home:'M3 11l9-8 9 8M5 10v10h14V10',
  users:'M16 20v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 20v-1a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',
  card:'M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM2 10h20M6 15h4',
  phone:'M8 2h8a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zM11 18h2',
  link:'M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1',
  swap:'M4 7h15l-4-4M20 17H5l4 4',
  list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
  db:'M12 3c4.4 0 8 1.3 8 3s-3.6 3-8 3-8-1.3-8-3 3.6-3 8-3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3',
  search:'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14M21 21l-5-5',
  plus:'M12 5v14M5 12h14',
  check:'M5 12l5 5L20 7',
  x:'M6 6l12 12M18 6L6 18',
  right:'M5 12h14M13 6l6 6-6 6',
  alert:'M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0',
  info:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M12 16v-4M12 8h.01',
  clock:'M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18',
  unlink:'M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7M3 3l18 18',
  dl:'M12 3v12M7 10l5 5 5-5M4 21h16',
  lock:'M6 11h12v10H6zM8 11V7a4 4 0 0 1 8 0v4',
  updown:'M8 9l4-4 4 4M8 15l4 4 4-4'
};
const ic = (n, s = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"${s}><path d="${P[n]}"/></svg>`;
const MARK = (s = 28) => `<svg width="${s}" height="${s}" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#0E6A52"/><circle cx="8.5" cy="14" r="3.2" fill="#fff"/><circle cx="19.5" cy="14" r="3.2" fill="#fff"/><path d="M11.7 14h4.6" stroke="#fff" stroke-width="2.2"/></svg>`;

/* ---------- formato ---------- */
const fm = n => '₡' + n.toLocaleString('de-DE', {minimumFractionDigits:2, maximumFractionDigits:2});
const gi = x => x.replace(/(.{4})/g, '$1 ').trim();          // IBAN impreso en grupos de 4
const sh = x => x.slice(0,4) + ' … ' + x.slice(-4);
const num = x => `<span class="num">${x}</span>`;
const st = s => `<span class="st ${{ACTIVO:'ok', ACTIVA:'ok', INACTIVO:'no', INACTIVA:'no', BLOQUEADA:'bad'}[s]}">${s[0] + s.slice(1).toLowerCase()}</span>`;
const af = a => a ? '<span class="st ok">Afiliado</span>' : '<span class="st no hollow">Sin afiliar</span>';
const cur = m => `<span class="cur${m === 'USD' ? ' usd' : ''}">${m}</span>`;

/* ---------- datos ficticios ---------- */
const HUE = {'Ana Rodríguez Mora':20, 'Carlos Jiménez Solís':210, 'María Fernández Vargas':280, 'José Ramírez Castro':80, 'Laura Chaves Quesada':340};
const av = (n, l) => `<span class="av${l ? ' l' : ''}" style="background:hsl(${HUE[n]} 70% 92%);color:hsl(${HUE[n]} 45% 30%)">${n.split(' ').slice(0,2).map(w => w[0]).join('')}</span>`;
const C = [

      <thead><tr><th>Código</th><th>Nombre</th><th class="r">Cuentas</th><th></th></tr></thead><tbody>
      ${[['0152', 'JUNTAUCR'], ['0814', 'Banco Volcán'], ['0901', 'Cooperativa Arenal'], ['0733', 'Financiera Poás']].map(([c, n]) => `<tr><td class="num ink2">${c}</td><td class="b">${n}</td><td class="r num">${A.filter(a => a.en === n).length}</td><td class="r"><span class="btn s">Editar</span></td></tr>`).join('')}
    </tbody></table></div>
    <div class="block"><div class="bh"><h2>Monedas</h2></div><table>
      <thead><tr><th>Código</th><th>Descripción</th><th>Símbolo</th><th class="r">Cuentas</th></tr></thead><tbody>
      <tr><td>${cur('CRC')}</td><td class="b">Colón costarricense</td><td>₡</td><td class="r num">${A.filter(a => a.m === 'CRC').length}</td></tr>
      <tr><td>${cur('USD')}</td><td class="b">Dólar estadounidense</td><td>$</td><td class="r num">${A.filter(a => a.m === 'USD').length}</td></tr>
    </tbody></table><div class="bb" style="padding-top:12px"><div class="note">${ic('info')}<div>Solo las cuentas en colones pueden afiliarse a SINPE Móvil.</div></div></div></div>
  </div>`)}
];

/* ---------- render ---------- */
const q = new URLSearchParams(location.search);
const app = document.getElementById('app');
const frame = s => `<div class="frame" id="f-${s.id}">${s.html()}</div>`;

if (q.get('pantalla')) {
  const s = SCREENS.find(x => x.id === q.get('pantalla')) || SCREENS[0];
  document.body.style.background = 'var(--frame)';
  app.innerHTML = frame(s);
  app.firstElementChild.style.minHeight = '100vh';
} else if (q.get('modo') === 'demo') {
  document.body.classList.add('motion');
  const show = () => {
    const s = SCREENS.find(x => x.id === location.hash.slice(1)) || SCREENS[0];
    app.innerHTML = `<div class="demo">${frame(s)}</div><div class="demo-bar">${s.name}<a href="?">Ver todas</a></div>`;
    window.scrollTo(0, 0);
  };
  window.addEventListener('hashchange', show);
  app.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) location.hash = g.dataset.go; });
  show();
} else {
  app.innerHTML = `<div class="canvas">
    <div class="canvas-head"><h1>JUNTAUCR · Operaciones SINPE</h1>
      <p>${SCREENS.length} pantallas de 1440 px con datos ficticios. <a href="?modo=demo">Abrir el prototipo navegable</a></p></div>
    ${SCREENS.map(s => `<div><div class="label">${s.name}</div>${frame(s)}</div>`).join('')}
  </div>`;
  app.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) document.getElementById('f-' + g.dataset.go)?.scrollIntoView({behavior:'smooth', block:'start'}); });
}
</script>
</body>
</html>
